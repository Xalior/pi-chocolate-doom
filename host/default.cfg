# default.cfg — the vanilla-format settings, read from the card's doom/
# directory. Chocolate Doom writes this file back when it exits.
#
# Nothing in this port needs a value here to be different from Doom's own,
# so this file exists to be found rather than to change anything: without
# it the game writes a fresh one on first exit, and a card that is read-only
# or removed before the game exits would never get one.

show_messages           1
screenblocks            10
detaillevel             0
sfx_volume              8
music_volume            8
mouse_sensitivity       5
