# chocolate-doom.cfg — this port's settings, read from the card's doom/
# directory. Chocolate Doom writes this file back when it exits, so an
# edit made here is the starting point, not a permanent one.
#
# Every setting below exists because of something this port cannot do. Each
# one is safe to change; the note says what happens if you do.

# The renderer draws to the screen and to nothing else: circle-libsdl2 has
# no render-to-texture. Smooth scaling needs one, and with it on the game
# renders into a texture that was never created, which shows as a black
# screen with the game running behind it.
smooth_pixel_scaling      0

# Says out loud what is already true — the shim scales in software on a core
# of the host's choosing. It also keeps the game off the smooth-scaling path
# above even if that setting is turned back on.
force_software_renderer   1

# The pointer this port reports never moves, so a mouse cannot aim, and the
# menu is worked with the keyboard.
use_mouse                 0
grabmouse                 0

# Sound effects play. 3 is a Sound Blaster, which is upstream's own default
# and selects the SDL_mixer backend — the one that wants the raw samples the
# WAD carries. It is written down here rather than left to the game's default
# because a card staged before this port had sound carries a file saying 0,
# no device at all, and the game would go on reading it.
snd_sfxdevice             3

# Music is off, and 0 is what turns it off — but NOT because nothing here can
# play it. Chocolate Doom needs no MIDI synthesiser: it emulates the Sound
# Blaster's OPL2 chip itself and adds the chip's output to the mix through an
# SDL_mixer post effect, which the shim now carries. The code is in this
# image and the sound path it needs is there.
#
# What stops it is one moment at start-up. Setting the OPL up asks the chip
# for a timer and then waits for that timer to expire, and the timer is
# advanced by the audio callback. On a desktop the audio callback belongs to
# a thread of SDL's own, so a waiting game is still a game whose sound is
# running. Here the audio callback is driven by the game's own loop, so a
# game that waits is a game whose audio has stopped: the timer never
# advances, the wait never ends, and the board stops during I_InitSound
# rather than going quiet. Silence would have been acceptable; a board that
# never reaches the title screen is not.
#
# Setting this to 3 is therefore the experiment, not the fix — it turns the
# OPL music on and will hang the board until a waiting application core keeps
# feeding the audio device.
snd_musicdevice           0

# The exit screen is the DOS text-mode picture a WAD carries. Showing it
# needs a second window, and this board has one display.
show_endoom               0

# The window is whatever the host kernel declared before the game started,
# so these are what the game is told rather than what it asks for.
fullscreen                1
aspect_ratio_correct      1
