# chocolate-doom.cfg — this port's settings, read from the card's doom/
# directory. Chocolate Doom writes this file back when it exits, so an
# edit made here is the starting point, not a permanent one.
#
# Every setting below exists because of something this port cannot do. Each
# one is safe to change; the note says what happens if you do.

# The renderer draws to the screen and to nothing else: circle-libsdl2 has
# no render-to-texture. Smooth scaling needs one, and with it on the game
# renders into a texture that was never created, which shows as a black
# screen with the game running behind it.
smooth_pixel_scaling      0

# Says out loud what is already true — the shim scales in software on a core
# of the host's choosing. It also keeps the game off the smooth-scaling path
# above even if that setting is turned back on.
force_software_renderer   1

# The pointer this port reports never moves, so a mouse cannot aim, and the
# menu is worked with the keyboard.
use_mouse                 0
grabmouse                 0

# There is no sound yet: SDL_mixer is not part of this port, so the game is
# built without it and every sound and music backend reports that it could
# not start. These say so up front rather than leaving the game to discover
# it.
snd_sfxdevice             0
snd_musicdevice           0

# The exit screen is the DOS text-mode picture a WAD carries. Showing it
# needs a second window, and this board has one display.
show_endoom               0

# The window is whatever the host kernel declared before the game started,
# so these are what the game is told rather than what it asks for.
fullscreen                1
aspect_ratio_correct      1
